syntax = "proto3";

package message;

service VerifyService {
  rpc GetVerifyCode (GetVerifyRequest) returns (GetVerifyResponse) {}
}
message GetVerifyRequest {
  string email = 1;
}
message GetVerifyResponse {
  int32 error = 1;
  string email = 2;
  string code = 3;
}

message GetChatServerRequest{
  int32 uid = 1;
}

message GetChatServerResponse{
  int32 error = 1;
  string host = 2;
  string port = 3;
  string token = 4;
}

service StatusService{
   rpc GetChatServer (GetChatServerRequest) returns (GetChatServerResponse) {}
}

service ChatService{
   rpc ForwardMessage (ForwardMessageRequest) returns (ForwardMessageResponse) {}
}

message ForwardMessageRequest{
	int32 target_uid = 1;
	bytes message_data = 2;
}

message ForwardMessageResponse{
	int32 error = 1;
	string error_msg = 2;

}